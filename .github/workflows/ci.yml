name: CI

on:
  push:
  pull_request:

jobs:
  qualidade:
    name: Lint, tipos, migrações e testes
    runs-on: ubuntu-latest

    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: baseapi
          POSTGRES_PASSWORD: baseapi
          POSTGRES_DB: baseapi_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

    env:
      FLASK_TEST_DATABASE_URI: postgresql+psycopg://baseapi:baseapi@localhost:5432/baseapi_test
      FLASK_SECRET_KEY: chave-de-ci-sem-nenhum-valor-real-0001
      FLASK_JWT_SECRET_KEY: chave-jwt-de-ci-sem-valor-real-0002

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: requirements-dev.txt

      - name: Instalar dependências
        run: pip install -r requirements-dev.txt

      - name: Lint
        run: ruff check .

      - name: Formatação
        run: ruff format --check .

      - name: Tipos
        run: mypy

      # Detecta migração divergente dos modelos — a falha mais silenciosa
      # possível, porque a suíte usa create_all() e nunca passaria pelo Alembic.
      # O downgrade no fim também valida que o caminho de volta funciona, que de
      # outro modo nunca seria exercitado.
      - name: Migrações em sincronia com os modelos
        env:
          FLASK_SQLALCHEMY_DATABASE_URI: ${{ env.FLASK_TEST_DATABASE_URI }}
        run: |
          alembic upgrade head
          alembic check
          alembic downgrade base

      - name: Testes
        run: pytest
