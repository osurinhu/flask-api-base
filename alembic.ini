[alembic]
# Caminho relativo à raiz do projeto — rode o alembic a partir daqui.
script_location = migrations

# Nome dos arquivos de revisão: 0001_descricao.py
file_template = %%(rev)s_%%(slug)s

# A URL do banco NÃO fica aqui: migrations/env.py a lê da configuração da
# aplicação (settings.toml + variáveis de ambiente), para não duplicar a
# string de conexão nem versionar credenciais.

[loggers]
keys = root,sqlalchemy,alembic

[handlers]
keys = console

[formatters]
keys = generic

[logger_root]
level = WARNING
handlers = console
qualname =

[logger_sqlalchemy]
level = WARNING
handlers =
qualname = sqlalchemy.engine

[logger_alembic]
level = INFO
handlers =
qualname = alembic

[handler_console]
class = StreamHandler
args = (sys.stderr,)
level = NOTSET
formatter = generic

[formatter_generic]
format = %(levelname)-5.5s [%(name)s] %(message)s
datefmt = %H:%M:%S
